<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso Administrador</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <div class="icono">
                🔐
            </div>

            <h1>
                Acceso de Administrador
            </h1>

            <p>
                Ingrese sus credenciales
            </p>


            <form>

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese su usuario"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese su contraseña"
                    required
                >


                <button
                    type="submit"
                    class="boton-login"
                >
                    Ingresar
                </button>

            </form>


            <a
                href="index.html"
                class="volver"
            >
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
