<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso Administrador</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <div class="icono">
                🔐
            </div>

            <h1>
                Acceso de Administrador
            </h1>

            <p>
                Ingrese sus credenciales para continuar
            </p>


            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingrese su usuario"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                    required
                >


                {% if error %}
                    <div class="error">
                        ⚠️ {{ error }}
                    </div>
                {% endif %}


                <button
                    type="submit"
                    class="boton-login"
                >
                    Ingresar
                </button>

            </form>


            <a
                href="{{ url_for('index') }}"
                class="volver"
            >
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
